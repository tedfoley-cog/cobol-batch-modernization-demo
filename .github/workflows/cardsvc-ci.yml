name: cardsvc-ci

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/cardsvc-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/cardsvc-ci.yml']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -f backend/pom.xml verify
