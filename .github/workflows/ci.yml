name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: make fetch
      - run: make validate
  ui:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: make fetch
      - run: make report
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8000 --directory site >/tmp/cobol-demo-http.log 2>&1 &
          for attempt in $(seq 1 20); do curl --fail --silent http://127.0.0.1:8000/index.html >/dev/null && break; sleep 1; done
          pytest tests/ui -m ui --browser chromium --base-url http://127.0.0.1:8000
