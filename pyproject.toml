[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-batch-modernization-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "ruff==0.6.9",
  "playwright==1.47.0",
  "pytest-playwright==0.5.2",
]

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not ui'"
markers = ["ui: browser-based review UI journeys"]
